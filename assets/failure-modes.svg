<svg width="1000" height="460" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#0d2843"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#16406b" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f83a6"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="url(#fbg)"/>
  <rect width="1000" height="460" fill="url(#grid3)"/>
  <rect x="14" y="14" width="972" height="432" fill="none" stroke="#5f83a6" stroke-width="1"/>

  <text x="46" y="52" font-family="'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="700" fill="#eaf2fa">Fig. 2 — what breaks, and what happens next</text>
  <text x="46" y="74" font-family="Consolas, monospace" font-size="12" fill="#7f9db8">the part of the system that doesn't show up in a demo</text>

  <g font-family="Consolas, monospace" font-size="12.5">
    <!-- row template repeated 5x -->
    <!-- row 1 -->
    <circle cx="66" cy="120" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="66" y="124" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
    <text x="86" y="124" fill="#eaf2fa">Redis goes down</text>
    <line x1="330" y1="120" x2="590" y2="120" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
    <circle cx="614" cy="120" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M609,120 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
    <text x="634" y="124" fill="#eaf2fa">sessions fall back to Postgres — no forced logout</text>

    <!-- row 2 -->
    <circle cx="66" cy="180" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="66" y="184" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
    <text x="86" y="184" fill="#eaf2fa">scraper gets blocked</text>
    <line x1="330" y1="180" x2="590" y2="180" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
    <circle cx="614" cy="180" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M609,180 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
    <text x="634" y="184" fill="#eaf2fa">Celery retries with backoff, then flags — doesn't fail the run</text>

    <!-- row 3 -->
    <circle cx="66" cy="240" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="66" y="244" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
    <text x="86" y="244" fill="#eaf2fa">model returns a weak answer</text>
    <line x1="330" y1="240" x2="590" y2="240" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
    <circle cx="614" cy="240" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M609,240 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
    <text x="634" y="244" fill="#eaf2fa">confidence check routes to a cited fallback, not a guess</text>

    <!-- row 4 -->
    <circle cx="66" cy="300" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="66" y="304" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
    <text x="86" y="304" fill="#eaf2fa">a worker dies mid-job</text>
    <line x1="330" y1="300" x2="590" y2="300" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
    <circle cx="614" cy="300" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M609,300 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
    <text x="634" y="304" fill="#eaf2fa">task is re-queued — not silently dropped</text>

    <!-- row 5 -->
    <circle cx="66" cy="360" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
    <text x="66" y="364" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
    <text x="86" y="364" fill="#eaf2fa">a schema change ships</text>
    <line x1="330" y1="360" x2="590" y2="360" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
    <circle cx="614" cy="360" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <path d="M609,360 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
    <text x="634" y="364" fill="#eaf2fa">Alembic migration runs behind the pytest gate, reversible</text>
  </g>

  <text x="46" y="424" font-family="Consolas, monospace" font-size="11.5" fill="#5f83a6">fault</text>
  <text x="634" y="424" font-family="Consolas, monospace" font-size="11.5" fill="#5f83a6">handled</text>
</svg>
