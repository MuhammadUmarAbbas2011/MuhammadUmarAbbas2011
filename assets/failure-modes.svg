<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#0d2843"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#16406b" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f83a6"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#fbg)"/>
  <rect width="1200" height="520" fill="url(#grid3)"/>
  <rect x="14" y="14" width="1172" height="492" fill="none" stroke="#5f83a6" stroke-width="1"/>

  <text x="46" y="54" font-family="'Arial Narrow', Arial, sans-serif" font-size="25" font-weight="700" fill="#eaf2fa">Fig. 3 — what breaks, and what happens next</text>
  <text x="46" y="76" font-family="Consolas, monospace" font-size="12" fill="#7f9db8">the part of the system that doesn't show up in a demo</text>

  <g font-family="Consolas, monospace" font-size="12">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze"/>
      <circle cx="66" cy="130" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <text x="66" y="134" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
      <text x="86" y="134" fill="#eaf2fa">Redis goes down</text>
      <line x1="340" y1="130" x2="580" y2="130" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
      <circle cx="600" cy="130" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M595,130 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
      <text x="620" y="134" fill="#eaf2fa">sessions fall back to Postgres — no forced logout</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
      <circle cx="66" cy="190" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <text x="66" y="194" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
      <text x="86" y="194" fill="#eaf2fa">scraper gets blocked</text>
      <line x1="340" y1="190" x2="580" y2="190" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
      <circle cx="600" cy="190" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M595,190 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
      <text x="620" y="194" fill="#eaf2fa">Celery retries with backoff, then flags — doesn't fail the run</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
      <circle cx="66" cy="250" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <text x="66" y="254" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
      <text x="86" y="254" fill="#eaf2fa">model returns a weak answer</text>
      <line x1="340" y1="250" x2="580" y2="250" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
      <circle cx="600" cy="250" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M595,250 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
      <text x="620" y="254" fill="#eaf2fa">confidence check routes to a cited fallback, not a guess</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
      <circle cx="66" cy="310" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <text x="66" y="314" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
      <text x="86" y="314" fill="#eaf2fa">a worker dies mid-job</text>
      <line x1="340" y1="310" x2="580" y2="310" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
      <circle cx="600" cy="310" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M595,310 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
      <text x="620" y="314" fill="#eaf2fa">task is re-queued — not silently dropped</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.5s" fill="freeze"/>
      <circle cx="66" cy="370" r="9" fill="none" stroke="#f87171" stroke-width="1.5"/>
      <text x="66" y="374" text-anchor="middle" fill="#f87171" font-weight="700">!</text>
      <text x="86" y="374" fill="#eaf2fa">a schema change ships</text>
      <line x1="340" y1="370" x2="580" y2="370" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
      <circle cx="600" cy="370" r="9" fill="none" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M595,370 l4,4 l7,-8" stroke="#4ade80" stroke-width="1.6" fill="none"/>
      <text x="620" y="374" fill="#eaf2fa">Alembic migration runs behind the pytest gate, reversible</text>
    </g>
  </g>

  <text x="46" y="440" font-family="Consolas, monospace" font-size="11.5" fill="#5f83a6">fault</text>
  <text x="620" y="440" font-family="Consolas, monospace" font-size="11.5" fill="#5f83a6">handled</text>

  <line x1="46" y1="470" x2="1154" y2="470" stroke="#16406b" stroke-width="1"/>
  <circle r="4" fill="#f5a524">
    <animateMotion dur="9s" repeatCount="indefinite" path="M46,470 L1154,470"/>
  </circle>
  <text x="46" y="500" font-family="Consolas, monospace" font-size="11.5" fill="#5f83a6">five failure modes, all handled before they reach the user</text>
</svg>
