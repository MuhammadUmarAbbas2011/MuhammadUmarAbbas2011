<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#0d2843"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#16406b" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" fill="url(#hbg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- drafting-sheet frame -->
  <rect x="14" y="14" width="972" height="252" fill="none" stroke="#5f83a6" stroke-width="1"/>
  <path d="M14 14 L34 14 M14 14 L14 34" stroke="#d7e6f5" stroke-width="1.5"/>
  <path d="M986 14 L966 14 M986 14 L986 34" stroke="#d7e6f5" stroke-width="1.5"/>
  <path d="M14 266 L34 266 M14 266 L14 246" stroke="#d7e6f5" stroke-width="1.5"/>
  <path d="M986 266 L966 266 M986 266 L986 246" stroke="#d7e6f5" stroke-width="1.5"/>

  <!-- title block, bottom right, like a real drawing sheet -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#7f9db8">
    <rect x="742" y="216" width="222" height="38" fill="none" stroke="#5f83a6" stroke-width="0.75"/>
    <line x1="742" y1="229" x2="964" y2="229" stroke="#5f83a6" stroke-width="0.5"/>
    <line x1="742" y1="242" x2="964" y2="242" stroke="#5f83a6" stroke-width="0.5"/>
    <text x="750" y="226">DWG. MUHAMMAD UMAR ABBAS</text>
    <text x="750" y="239">SHEET 1 OF 1 — README.svg</text>
    <text x="750" y="252">SCALE: NOT TO SCALE</text>
  </g>

  <!-- main title -->
  <text x="46" y="108" font-family="'Arial Narrow', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#eaf2fa">Muhammad Umar Abbas</text>
  <text x="46" y="140" font-family="'Arial Narrow', Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="1" fill="#7f9db8">Full-stack AI architect</text>
  <text x="46" y="172" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#5f83a6">the model is one part of the drawing — the rest is what makes it hold up</text>

  <!-- small exploded-view diagram illustrating the thesis -->
  <g>
    <rect x="46" y="196" width="330" height="52" rx="4" fill="none" stroke="#5f83a6" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="58" y="216" font-family="Consolas, monospace" font-size="10.5" fill="#7f9db8">auth · sessions · queue · retries · migrations</text>
    <rect x="252" y="224" width="46" height="18" rx="2" fill="#f5a524"/>
    <text x="275" y="237" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a2036" font-weight="700">LLM</text>
    <line x1="275" y1="224" x2="275" y2="216" stroke="#f5a524" stroke-width="1"/>
    <text x="392" y="215" font-family="Consolas, monospace" font-size="11" fill="#f5a524">1 box out of 9</text>
    <text x="392" y="232" font-family="Consolas, monospace" font-size="11" fill="#7f9db8">— the rest is on the next sheet</text>
  </g>
</svg>
