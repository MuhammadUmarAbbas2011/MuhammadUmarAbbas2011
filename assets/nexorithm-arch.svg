      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="ntitle" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
