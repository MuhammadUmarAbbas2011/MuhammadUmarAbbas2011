    <text x="139" y="643" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#c9d1d9">Alembic migrations</text>
    <rect x="224" y="624" width="80" height="30" rx="15" fill="#101d3d" stroke="#d29922" stroke-opacity="0.5"/>
    <text x="264" y="643" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#c9d1d9">pytest</text>
    <rect x="314" y="624" width="150" height="30" rx="15" fill="#101d3d" stroke="#6e7f9c" stroke-opacity="0.5"/>
    <text x="389" y="643" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#c9d1d9">Docker Compose</text>
