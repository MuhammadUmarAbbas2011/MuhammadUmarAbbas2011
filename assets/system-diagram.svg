<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1000" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#0d2843"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#16406b" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d7e6f5"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="url(#sbg)"/>
  <rect width="1000" height="760" fill="url(#grid2)"/>
  <rect x="14" y="14" width="972" height="732" fill="none" stroke="#5f83a6" stroke-width="1"/>

  <text x="46" y="52" font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700" fill="#eaf2fa">Fig. 2 — request lifecycle, Nexorithm</text>
  <text x="46" y="76" font-family="Consolas, monospace" font-size="12.5" fill="#7f9db8">JobHuntly runs the same shape — swap retrieval for scraping and generation for scoring</text>

  <!-- main spine -->
  <line x1="80" y1="400" x2="900" y2="400" stroke="#d7e6f5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle r="5" fill="#f5a524">
    <animateMotion dur="7s" repeatCount="indefinite" path="M80,400 L900,400"/>
  </circle>

  <text x="60" y="392" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7f9db8">request</text>
  <text x="915" y="392" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7f9db8">response</text>

  <!-- each numbered part fades in once, in order, like a drawing being assembled -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.45s" fill="freeze"/>
    <line x1="150" y1="400" x2="150" y2="300" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="150" cy="400" r="4" fill="#d7e6f5"/>
    <rect x="90" y="248" width="150" height="52" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1"/>
    <text x="165" y="269" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">1</text>
    <text x="165" y="285" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Auth</text>
    <text x="165" y="298" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">JWT + OTP</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.45s" fill="freeze"/>
    <rect x="270" y="376" width="140" height="48" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1.4"/>
    <text x="340" y="396" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">2</text>
    <text x="340" y="412" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">API layer — FastAPI</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.45s" fill="freeze"/>
    <line x1="340" y1="424" x2="340" y2="500" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="340" cy="424" r="4" fill="#d7e6f5"/>
    <rect x="260" y="500" width="160" height="56" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1"/>
    <text x="340" y="521" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">3</text>
    <text x="340" y="537" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Sessions</text>
    <text x="340" y="550" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">Redis → Postgres fallback</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.45s" fill="freeze"/>
    <line x1="480" y1="400" x2="480" y2="300" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="480" cy="400" r="4" fill="#d7e6f5"/>
    <rect x="410" y="238" width="150" height="62" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1"/>
    <text x="485" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">4</text>
    <text x="485" y="276" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Retrieval</text>
    <text x="485" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">FastEmbed + Qdrant</text>
  </g>

  <!-- 5 Generation — deliberately the smallest box, and the only one that keeps pulsing -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.45s" fill="freeze"/>
    <line x1="560" y1="400" x2="560" y2="470" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="560" cy="400" r="4" fill="#d7e6f5"/>
    <rect x="524" y="470" width="72" height="34" rx="4" fill="#f5a524" stroke="#f5a524">
      <animate attributeName="opacity" values="1;0.55;1" begin="1.6s" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="483" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0a2036" font-weight="700">5</text>
    <text x="560" y="497" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#0a2036" font-weight="700">LLM</text>
    <text x="560" y="522" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">smallest box on purpose</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.45s" fill="freeze"/>
    <line x1="660" y1="400" x2="660" y2="300" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="660" cy="400" r="4" fill="#d7e6f5"/>
    <rect x="590" y="238" width="150" height="62" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1"/>
    <text x="665" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">6</text>
    <text x="665" y="276" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Validation</text>
    <text x="665" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">confidence check + fallback</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.45s" fill="freeze"/>
    <line x1="760" y1="400" x2="760" y2="500" stroke="#5f83a6" stroke-width="1"/>
    <circle cx="760" cy="400" r="4" fill="#d7e6f5"/>
    <rect x="680" y="500" width="160" height="56" rx="4" fill="#0f1e33" stroke="#d7e6f5" stroke-width="1"/>
    <text x="760" y="521" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">7</text>
    <text x="760" y="537" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Data layer</text>
    <text x="760" y="550" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">Postgres + Alembic migrations</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.45s" fill="freeze"/>
    <line x1="340" y1="400" x2="340" y2="620" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="230" y="620" width="220" height="56" rx="4" fill="#0f1e33" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="340" y="641" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">8</text>
    <text x="340" y="657" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Background jobs — Celery</text>
    <text x="340" y="670" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">off the critical path, retried on failure</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.45s" fill="freeze"/>
    <line x1="760" y1="556" x2="760" y2="620" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="650" y="620" width="220" height="56" rx="4" fill="#0f1e33" stroke="#5f83a6" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="760" y="641" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#f5a524">9</text>
    <text x="760" y="657" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" fill="#eaf2fa">Deploy — Docker Compose + CI</text>
    <text x="760" y="670" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7f9db8">pytest gates the build first</text>
  </g>

  <text x="46" y="726" font-family="Consolas, monospace" font-size="12" fill="#5f83a6">one box does the "AI" part — the other eight are why it doesn't fall over in production</text>
</svg>
